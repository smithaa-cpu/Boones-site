<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOONES | Bone and Joint Program</title>
<meta name="description" content="BOONES: a 6 week bone and joint exercise and education program by Adrian Smith, PT.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a calm course player. Slate top bar, week rail, one lesson at a time with big Next buttons. Coral marks what to do next. */
:root{
  --bg:#F5F7F9; --surface:#FFFFFF; --soft:#EEF2F6; --fg:#26323F; --muted:#4F5D6B; --line:#D3DBE3;
  --accent:#26323F; --accent-fg:#FFFFFF; --link:#B8432C;
  --amber:#EE6A50; --amber-soft:#FDE3DC; --amber-ink:#9A3420;
  --bar:#DCE6EE; --bar-fg:#1E2933; --bar-muted:#9FB0C0;
  --side:#26323F; --side-fg:#FFFFFF; --side-muted:#B4C0CC; --side-hover:rgba(255,255,255,.1);
  --good:#1D5E36; --good-soft:#D5EBDC; --bad:#8A2A1B; --bad-soft:#F4D0C8; --warn-soft:#FBEBC4; --warn-ink:#6B4A0E;
  --display:'Sora', 'Segoe UI', Arial, sans-serif;
  --body:'Source Sans 3', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A22; --surface:#1B2631; --soft:#24313E; --fg:#E8EDF2; --muted:#A9B6C3; --line:#34424F;
  --accent:#F0806A; --accent-fg:#1A0F0C; --link:#F7A493;
  --amber:#F0806A; --amber-soft:#3A2420; --amber-ink:#F7A493;
  --bar:#0C1218; --bar-fg:#E8EDF2; --bar-muted:#A9B6C3; --side:#0C1218; --side-fg:#E8EDF2; --side-muted:#A9B6C3; --side-hover:rgba(255,255,255,.08);
  --good:#8FD6A6; --good-soft:#1C3527; --bad:#F2A497; --bad-soft:#3D2420; --warn-soft:#3A3120; --warn-ink:#F4D68C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A22; --surface:#1B2631; --soft:#24313E; --fg:#E8EDF2; --muted:#A9B6C3; --line:#34424F;
  --accent:#F0806A; --accent-fg:#1A0F0C; --link:#F7A493;
  --amber:#F0806A; --amber-soft:#3A2420; --amber-ink:#F7A493;
  --bar:#0C1218; --bar-fg:#E8EDF2; --bar-muted:#A9B6C3; --side:#0C1218; --side-fg:#E8EDF2; --side-muted:#A9B6C3; --side-hover:rgba(255,255,255,.08);
  --good:#8FD6A6; --good-soft:#1C3527; --bad:#F2A497; --bad-soft:#3D2420; --warn-soft:#3A3120; --warn-ink:#F4D68C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:19px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--bar);color:var(--bar-fg);border-bottom:1px solid var(--line)}
header.top .btn.ghost{color:var(--bar-fg);border-color:var(--bar-muted)}
header.top .btn.ghost:hover{border-color:var(--amber)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bar-fg);font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em}
.tiles{display:flex;gap:3px}
.tiles span{width:14px;height:14px;border-radius:3px;background:var(--bar-fg)}
.tiles span.o{}
.tiles span.s{background:var(--amber)}
nav.links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:600;font-size:18px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:44px;padding:0 14px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
main{padding-block:28px 0;min-width:0}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.side .brand{color:var(--side-fg);padding:4px 8px 18px}
.side .label{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-radius:12px;color:var(--side-fg);text-decoration:none;font-size:17px}
.nav:hover{background:var(--side-hover)}
.nav.on{background:var(--side-hover);font-weight:700;box-shadow:inset 3px 0 0 var(--amber)}
.nav.cta{background:var(--amber);color:#1F1512;font-weight:700}
.nav.cta.on{box-shadow:none;outline:2px solid var(--side-fg);outline-offset:-2px}
.nav .num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--side-hover);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;font-weight:600}
.nav .num.done{background:var(--good);color:#FFFFFF}
.side .bottom{margin-top:auto;padding-top:14px}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;overflow:visible;gap:8px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side .brand{padding:0 4px}
  #sidenav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px}
  #sidenav::-webkit-scrollbar{display:none}
  .side .label{display:none}
  .side .bottom{display:contents}
  .nav{flex:none;white-space:nowrap;min-height:42px;padding:6px 12px;gap:8px;font-size:15px}
  .nav .num{width:24px;height:24px;font-size:13px}
  .nav.on{box-shadow:inset 0 -3px 0 var(--amber)}
}
.herocard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;margin-bottom:20px}
.herocard .deco{position:absolute;right:36px;top:30px;width:190px;height:170px}
.herocard .txt{position:relative;max-width:calc(100% - 220px)}
.herocard h1{font-size:clamp(30px,4.5vw,44px);margin-top:8px}
.herocard p{color:var(--muted);max-width:34em}
@media (max-width:700px){.herocard .deco{width:110px;height:100px;right:-10px;top:-10px;opacity:.5}.herocard .txt{max-width:100%}.herocard{padding:24px 20px}}
.eyebrow{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--link)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:32px;align-items:center;padding-block:12px 32px}
.hero h1{font-size:clamp(34px,6vw,52px);margin-top:8px}
.hero p{color:var(--muted);max-width:34em}
.bigtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px}
.bigtiles div{aspect-ratio:1;max-width:100%;border-radius:20px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:clamp(36px,8vw,56px)}
.bigtiles .o{}
.bigtiles .s{background:var(--amber);color:#1F1512}
.progressbar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--amber);border-radius:99px}
.weeks{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:20px;max-width:820px}
.wk{display:flex;gap:16px;align-items:flex-start;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-decoration:none;color:var(--fg)}
.wk:hover{border-color:var(--accent)}
.letter{flex:none;width:52px;height:52px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:24px}
.letter.o{}
.letter.s{background:var(--amber);color:#1F1512}
.wk h3{font-size:20px;margin-top:2px}
a.stat{display:block;text-decoration:none;color:var(--fg);cursor:pointer}
a.stat:hover{border-color:var(--amber)}
a.stat .go{display:block;margin-top:6px;font-size:15px;font-weight:600;color:var(--link)}
.journey{position:relative;margin-top:20px;display:flex;flex-direction:column;gap:22px}
.journey::before{content:"";position:absolute;left:25px;top:20px;bottom:20px;width:3px;border-radius:2px;background:var(--line)}
.jmod{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;align-items:start}
.jmod .letter{position:relative;z-index:1}
.jmod.complete .letter{background:var(--good);color:#FFFFFF}
.jcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.jcard h3{font-size:20px;margin-bottom:8px}
.jrow{display:flex;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--line)}
.jrow:first-of-type{border-top:0}
.jrow input{width:26px;height:26px;flex:none;accent-color:var(--good)}
.jrow button{flex:1;text-align:left;background:none;border:0;padding:8px 0;font:inherit;color:var(--fg);cursor:pointer}
.jrow button:hover{color:var(--link);text-decoration:underline}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;margin:0 0 18px}
.todaycard{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line)}
.todaycard.ex{background:var(--amber-soft);border-color:var(--amber)}
.todaycard:hover{border-color:var(--amber)}
.todaycard .ico{flex:none;width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent)}
.todaycard.ex .ico{background:var(--amber)}
.todaycard b{display:block;font-family:var(--display);font-size:20px}
.todaycard span{color:var(--muted);font-size:16px}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:22px;max-width:820px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.excard.rec{border:2px solid var(--amber)}
.excard .top{display:flex;gap:14px;align-items:center}
.excard h3{font-size:20px}
.excard .meta{color:var(--muted);font-size:16px}
.recchip{align-self:flex-start;font-family:var(--display);font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--amber);color:#1F1512}
.excard .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.cal .dow{text-align:center;font-size:14px;font-weight:600;color:var(--muted);padding-bottom:4px}
.cal .day{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-variant-numeric:tabular-nums;position:relative}
.cal .day.blank{background:transparent}
.cal .day.s1{background:var(--amber-soft);font-weight:700}
.cal .day.s2{background:var(--amber);color:#1F1512;font-weight:700}
.cal .day.today{outline:2px solid var(--fg);outline-offset:-2px}
.cal .day .dots{font-size:11px;line-height:1}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.chart .bar{fill:var(--accent)}
.chart .bar.cur{fill:var(--amber)}
.chart text{fill:var(--muted);font-family:var(--body);font-size:13px}
.chart .val{fill:var(--fg);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:5 4}
.legendrow{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-top:8px}
.legendrow i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px;margin:4px 0 28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:16px}
.wk .meta{font-size:16px;color:var(--muted);margin-top:4px}
.done-chip{display:inline-block;margin-top:8px;font-size:14px;font-family:var(--display);font-weight:600;padding:3px 10px;border-radius:99px;background:var(--good-soft);color:var(--good)}
.player{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:820px){.player{grid-template-columns:minmax(0,1fr)}}
.lesson h1{font-size:clamp(28px,4.5vw,40px);margin-top:6px}
.lesson .summary{color:var(--muted);margin:10px 0 20px;max-width:38em}
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg);border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{width:84px;height:84px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.video .play svg{margin-left:6px}
.video .cap{position:absolute;left:16px;bottom:14px;right:16px;font-family:var(--display);font-weight:600;font-size:16px}
.points{display:flex;flex-direction:column;gap:10px;margin:22px 0 0;padding:0;list-style:none}
.points li{display:flex;gap:12px}
.points li::before{content:"";flex:none;width:9px;height:9px;margin-top:11px;border-radius:50%;background:var(--amber)}
.panel{margin-top:24px;padding:20px;border-radius:16px;background:var(--soft)}
.panel h3{font-size:20px;margin-bottom:10px}
.try{background:var(--amber-soft)}
.try .eyebrow{color:var(--amber-ink)}
.lessonnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
aside.rail{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
aside.rail h2{font-size:18px;margin-bottom:10px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rail button{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 10px;border-radius:10px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;text-align:left;cursor:pointer}
.rail button[aria-current="true"]{background:var(--soft);font-weight:700}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--accent);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:12px;margin-top:20px;font-size:18px;cursor:pointer}
.check input{width:28px;height:28px;accent-color:var(--accent)}
.quiz fieldset{border:0;padding:0;margin:0 0 22px}
.quiz legend{font-weight:700;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;min-height:52px;margin-bottom:8px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:4px;font-weight:700}
.feedback.right{color:var(--good)}.feedback.wrong{color:var(--bad)}
.pain{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:18px}
.pain label{font-weight:700;display:block;margin-bottom:6px}
.pain input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
.zone{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:99px;font-family:var(--display);font-weight:600;font-size:15px}
.zone.g{background:var(--good-soft);color:var(--good)}.zone.y{background:var(--warn-soft);color:var(--warn-ink)}.zone.r{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:10px;text-align:left}
th{font-family:var(--display);font-size:16px;background:var(--soft)}
td input{width:100%;min-height:44px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.note{font-size:16px;color:var(--muted)}
.stop{border:2px solid var(--bad);border-radius:16px;padding:16px 20px;margin-top:20px}
.stop strong{color:var(--bad)}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.wk,.btn,.opt{transition:border-color .15s,background .15s}}
</style>
</head>
<body>


<div class="shell">
<aside class="side" aria-label="Course menu">
  <a class="brand" href="#home" aria-label="BOONES home"><svg class="mark" width="40" height="40" viewBox="0 0 44 44" aria-hidden="true"><circle cx="15" cy="13" r="9" fill="none" stroke="var(--amber)" stroke-width="3.5"/><circle cx="25" cy="27" r="15" fill="var(--amber)"/></svg>BOONES</a>
  <nav id="sidenav" aria-label="Main"></nav>
</aside>
<main><div class="wrap" id="app"></div>
<footer style="margin-top:56px"><div class="wrap">BOONES is an original bone and joint health program by Adrian Smith, PT. These videos support, but do not replace, advice from your physiotherapist.</div></footer>
</main>
</div>


<script>
/* ============ EDIT HERE ============
   Paste each YouTube video ID into "youtube" (the part after watch?v= ).
   EMBED_VIDEOS: keep false inside Claude. Set true once this page is hosted on your own website
   so videos play right on the page instead of opening YouTube. */
const EMBED_VIDEOS = true;

const COURSE = [
 {id:"start", letter:"", title:"Start here", sub:"Welcome, safety and your starting tests", lessons:[
  {id:"welcome", type:"video", title:"Welcome to BOONES", youtube:"", minutes:3,
   summary:"What the next 6 weeks look like and how to get the most out of them.",
   points:["6 weeks of education and exercise for bones and joints","One short talk and follow-along exercise videos each week","Go at your own pace. Steady beats fast."]},
  {id:"setup", type:"video", title:"Safety and setup", youtube:"", minutes:5,
   summary:"Set up a safe space at home before you start.",
   points:["A sturdy chair without wheels and a counter to hold","Supportive shoes and a clear floor","Water nearby, and a phone within reach"],
   stop:true},
  {id:"pain", type:"pain", title:"How much discomfort is okay?",
   summary:"Some discomfort during exercise is normal and safe. Use this guide every session."},
  {id:"tests", type:"tests", title:"Your starting tests",
   summary:"Write down your starting numbers so you can see your progress at 6 weeks."}
 ]},
 {id:"week1", letter:"B", title:"Balance", sub:"Steady on your feet, and in life", lessons:[
  {id:"talk", type:"video", title:"The balance talk", youtube:"", minutes:10, summary:"How balance works and how to lower your risk of falling.",
   points:["Balance relies on your eyes, inner ear and joint sense","1 in 3 adults over 65 falls each year. Falls cause most broken hips.","Strong legs, good shoes, a walking aid if needed and a safe home lower your risk","Fear of falling makes us move less, which weakens balance"],
   tryThis:"Hold the counter and stand on one leg while the kettle boils."},
  {id:"class", type:"video", title:"Week 1 exercise class", youtube:"", minutes:30, summary:"Follow along. Today, take it easy and learn the moves.", pain:true},
  {id:"quiz", type:"quiz", title:"Quick check", questions:[
   {q:"Which of these lowers your risk of falling?", opts:["Sitting more to stay safe","Stronger legs and supportive shoes","Avoiding stairs completely"], a:1, why:"Strength and good footwear make you steadier. Moving less does the opposite."},
   {q:"Fear of falling often leads to...", opts:["Better balance","Moving less, which weakens balance","No change at all"], a:1, why:"That is why we keep moving, safely."}]}
 ]},
 {id:"week2", letter:"O", title:"Osteoarthritis", sub:"Joints that move feel better", lessons:[
  {id:"talk", type:"video", title:"The arthritis talk", youtube:"", minutes:10, summary:"What osteoarthritis really is, and what helps most.",
   points:["Arthritis affects the whole joint, not just the cartilage","It is not just wear and tear. Cartilage needs movement to stay healthy.","X-rays often don't match pain. Your symptoms guide treatment.","Best first steps: exercise, education and a healthy weight"],
   tryThis:"Pick one activity you avoid. How could you change it instead of stopping?"},
  {id:"class", type:"video", title:"Week 2 exercise class", youtube:"", minutes:30, summary:"Follow along at your own level.", pain:true},

const WEEKLY_GOAL = 2;
function allSessions(){
  const ss = store.get("sessions", {});
  return Object.entries(ss).flatMap(([mid,arr]) => arr.map(t => ({mid, d: parseWhen(t), hasTime: t.length>10})))
    .sort((a,b)=>a.d-b.d);
}
function parseWhen(t){ if(t.length===10){ const [y,m,d]=t.split("-").map(Number); return new Date(y,m-1,d); } return new Date(t); }
function dayKey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function weekStart(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function autoLog(mid){
  const ss = store.get("sessions", {}); const today = dayKey(new Date());
  if((ss[mid]||[]).some(t=>dayKey(parseWhen(t))===today)) return;
  ss[mid]=(ss[mid]||[]).concat(new Date().toISOString()); store.set("sessions", ss);
}
let calOffset = 0;
function attendance(){
  const list = allSessions();
  const now = new Date(), ws = weekStart(now);
  const thisWeek = list.filter(x=>x.d>=ws).length;
  const thisMonth = list.filter(x=>x.d.getMonth()===now.getMonth() && x.d.getFullYear()===now.getFullYear()).length;
  // weeks in a row meeting goal, counting back from last complete week (this week counts if already met)
  let streak=0; { let w=new Date(ws); if(thisWeek<WEEKLY_GOAL) w.setDate(w.getDate()-7);
    while(true){ const e=new Date(w); e.setDate(e.getDate()+7); const n=list.filter(x=>x.d>=w&&x.d<e).length; if(n>=WEEKLY_GOAL){streak++; w.setDate(w.getDate()-7);} else break; } }
  // last 8 weeks
  const weeks=[]; for(let i=7;i>=0;i--){ const w=new Date(ws); w.setDate(w.getDate()-7*i); const e=new Date(w); e.setDate(e.getDate()+7); weeks.push({w, n:list.filter(x=>x.d>=w&&x.d<e).length, cur:i===0}); }
  const maxN=Math.max(3, ...weeks.map(x=>x.n)); const W=640,H=240,L=34,B=34,T=20, bw=(W-L-10)/8;
  const y=v=>T+(H-T-B)*(1-v/maxN);
  const fmt=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Exercise sessions per week, last 8 weeks">
    ${Array.from({length:maxN+1},(_,v)=>`<line class="grid" x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("")}
    ${weeks.map((x,i)=>{ const cx=L+i*bw+bw/2, h=y(0)-y(x.n), bwid=Math.min(44,bw-14);
      return `<g><title>Week of ${fmt(x.w)}: ${x.n} ${x.n===1?"session":"sessions"}</title>
      ${x.n?`<rect class="bar ${x.cur?"cur":""}" x="${cx-bwid/2}" y="${y(x.n)}" width="${bwid}" height="${h}" rx="4"/>`:""}
      <rect x="${cx-bw/2}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>
      ${x.n?`<text class="val" x="${cx}" y="${y(x.n)-6}" text-anchor="middle">${x.n}</text>`:""}
      <text x="${cx}" y="${H-12}" text-anchor="middle">${x.cur?"This wk":fmt(x.w)}</text></g>`;}).join("")}
    <line class="goal" x1="${L}" x2="${W-6}" y1="${y(WEEKLY_GOAL)}" y2="${y(WEEKLY_GOAL)}"/>
  </svg>`;
  // calendar
  const cm=new Date(now.getFullYear(), now.getMonth()+calOffset, 1);
  const days=new Date(cm.getFullYear(), cm.getMonth()+1, 0).getDate(), lead=(cm.getDay()+6)%7;
  const counts={}; list.forEach(x=>{ const k=dayKey(x.d); counts[k]=(counts[k]||0)+1; });
  const cells=[]; for(let i=0;i<lead;i++) cells.push('<div class="day blank" aria-hidden="true"></div>');
  for(let d=1; d<=days; d++){ const dt=new Date(cm.getFullYear(),cm.getMonth(),d), n=counts[dayKey(dt)]||0, today=dayKey(dt)===dayKey(now);
    cells.push(`<div class="day ${n>=2?"s2":n?"s1":""} ${today?"today":""}" aria-label="${dt.toLocaleDateString(undefined,{month:"long",day:"numeric"})}: ${n} ${n===1?"session":"sessions"}">${d}${n?`<span class="dots" aria-hidden="true">${"&#9679;".repeat(Math.min(n,3))}</span>`:""}</div>`); }
  const recent=list.slice(-8).reverse();
  app.innerHTML = `<div class="eyebrow">My attendance</div><h1 style="font-size:clamp(30px,5vw,42px);margin-top:6px">How often you exercise</h1>
   <p class="summary" style="color:var(--muted);margin:10px 0 0">Your goal is ${WEEKLY_GOAL} exercise classes a week. Sessions are saved with the date and time when you finish a class or tap "I did this today."</p>
   <div class="stats" style="margin-top:20px">
     <div class="stat"><b>${thisWeek} of ${WEEKLY_GOAL}</b><span>this week</span></div>
     <div class="stat"><b>${thisMonth}</b><span>this month</span></div>
     <div class="stat"><b>${streak} ${streak===1?"week":"weeks"}</b><span>in a row at your goal</span></div>
     <div class="stat"><b>${list.length}</b><span>sessions in total</span></div>
   </div>
   <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="logtoday">I exercised today</button><a class="btn ghost" href="#exercises">Go to exercises</a></div>
   <div class="panel" style="background:var(--surface);border:1px solid var(--line)"><h3>Sessions per week</h3>
     <div class="legendrow"><span><i style="background:var(--amber)"></i>This week</span><span><i style="border-top:2px dashed var(--fg);border-radius:0;height:0;width:18px"></i>Weekly goal (${WEEKLY_GOAL})</span></div>
     ${chart}</div>
   <div class="panel" style="background:var(--surface);border:1px solid var(--line)">
     <div class="calhead"><button class="btn small ghost" id="calprev" aria-label="Previous month">&#8249;</button><h3 style="margin:0">${cm.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h3><button class="btn small ghost" id="calnext" aria-label="Next month" ${calOffset>=0?"disabled":""}>&#8250;</button></div>
     <div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells.join("")}</div>
     <div class="legendrow"><span><i style="background:var(--amber-soft)"></i>1 session</span><span><i style="background:var(--amber)"></i>2 or more</span></div>
   </div>
   <div class="panel" style="background:var(--surface);border:1px solid var(--line)"><h3>Recent sessions</h3>
   ${recent.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Time</th><th>Class</th></tr></thead><tbody>${recent.map(x=>{const m=COURSE.find(c=>c.id===x.mid);return `<tr><td>${x.d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</td><td>${x.hasTime?x.d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}):""}</td><td>${m?esc(m.title):"Exercise"}</td></tr>`;}).join("")}</tbody></table></div>`
     :`<p style="margin:0">No sessions yet. Finish an exercise class or tap "I exercised today" to start your record.</p>`}</div>`;
  document.getElementById("calprev").onclick=()=>{calOffset--; attendance();};
  document.getElementById("calnext").onclick=()=>{ if(calOffset<0){calOffset++; attendance();} };
  document.getElementById("logtoday").onclick=()=>{ const r=recClass(); const ss=store.get("sessions",{}); ss[r.m.id]=(ss[r.m.id]||[]).concat(new Date().toISOString()); store.set("sessions",ss); attendance(); };
}

function journey(){
  app.innerHTML = `<div class="eyebrow">My journey</div><h1 style="font-size:clamp(30px,5vw,42px);margin-top:6px">Your 6-week checklist</h1>
   <p class="summary" style="color:var(--muted);margin:10px 0 0">${doneCount()} of ${total} items completed. Tick an item off, or tap its name to open it.</p>
   <div class="journey">${COURSE.map((m,mi)=>`
    <div class="jmod ${modDone(m)===m.lessons.length?"complete":""}">
      <div class="${m.letter ? letterClass(m.letter) : "letter s"}" aria-hidden="true">${modDone(m)===m.lessons.length ? "&#10003;" : (m.letter || "&#9654;")}</div>
      <div class="jcard"><div class="eyebrow">${mi===0 ? "Before you begin" : "Week "+mi}</div><h3>${esc(m.title)}</h3>
      ${m.lessons.map((l,li)=>`<div class="jrow"><input type="checkbox" id="j-${m.id}-${li}" aria-label="Mark ${esc(l.title)} done" ${done[key(m,l)]?"checked":""}><button data-m="${m.id}" data-i="${li}">${esc(l.title)}</button></div>`).join("")}
      </div>
    </div>`).join("")}</div>`;
  app.querySelectorAll(".jrow input").forEach(c => c.onchange = () => {
    const [,mid,li] = c.id.split("-"); const m = COURSE.find(x=>x.id===mid); done[key(m,m.lessons[+li])] = c.checked; store.set("done",done); journey();
  });
  app.querySelectorAll(".jrow button").forEach(b => b.onclick = () => openLesson(b.dataset.m, +b.dataset.i));
}

function painlog(){
  const rows = COURSE.flatMap(m=>m.lessons.map((l,i)=>({m,l,i})).filter(x=>x.l.pain));
  app.innerHTML = `<div class="eyebrow">Pain checks</div><h1 style="font-size:clamp(30px,5vw,42px);margin-top:6px">How your body is responding</h1>
   <p class="summary" style="color:var(--muted);margin:10px 0 0">Rate your pain before and after each class. Some discomfort is normal. If pain is worse the next morning, do a little less next time.</p>
   <div class="pain" style="margin-top:18px">
     <div class="panel" style="margin:0;background:var(--good-soft)"><h3 style="color:var(--good)">0 to 2: Go ahead</h3>Keep going as planned.</div>
     <div class="panel" style="margin:0;background:var(--warn-soft)"><h3 style="color:var(--warn-ink)">3 to 5: Okay</h3>If it settles by the next day.</div>
     <div class="panel" style="margin:0;background:var(--bad-soft)"><h3 style="color:var(--bad)">6 to 10: Too much</h3>Ease off and do less next time.</div>
   </div>
   <div class="panel" style="background:var(--surface);border:1px solid var(--line)"><h3>My pain checks</h3><div class="tablewrap"><table><thead><tr><th>Class</th><th>Before</th><th>After</th><th></th></tr></thead><tbody>
   ${rows.map(x=>{ const v=store.get("pain/"+key(x.m,x.l),null);
     return `<tr><td>${esc(x.l.title)}</td><td>${v?v.before+"/10":"Not logged"}</td><td>${v?v.after+"/10":""}</td><td><button class="btn small ghost" data-m="${x.m.id}" data-i="${x.i}">${v?"Update":"Log pain"}</button></td></tr>`;}).join("")}
   </tbody></table></div></div>`;
  app.querySelectorAll("button[data-m]").forEach(b => b.onclick = () => openLesson(b.dataset.m, +b.dataset.i));
}

function sidenav(h){
  const nav = document.getElementById("sidenav");
  const wk = COURSE.filter(m=>m.letter);
  const item = (href, inner, extra="") => `<a class="nav ${extra} ${h===href?"on":""}" href="#${href}">${inner}</a>`;
  nav.innerHTML = item("start", "Start here", "cta")
    + item("home", '<span class="num" aria-hidden="true">&#8962;</span>Home')
    + item("exercises", '<span class="num" aria-hidden="true">&#9654;</span>Exercises')
    + `<div class="label">Your 6 weeks</div>`
    + wk.map((m,i)=>item(m.id, `<span class="num ${modDone(m)===m.lessons.length?"done":""}" aria-hidden="true">${modDone(m)===m.lessons.length?"&#10003;":i+1}</span><span class="wname">${esc(m.title)}</span>`)).join("")
    + `<div class="bottom">` + item("journey", "My checklist") + item("progress", "My progress") + item("attendance", "My attendance") + `</div>`;
  const on = nav.querySelector(".nav.on");
  if(on && window.matchMedia("(max-width:820px)").matches){ const x = on.offsetLeft - nav.offsetLeft; nav.scrollLeft = (x + on.offsetWidth > nav.clientWidth - 16) ? x - 16 : 0; }
}

function route(){
  const h = (location.hash||"#home").slice(1);
  sidenav(h || "home");
  const m = COURSE.find(x=>x.id===h);
  if(m) module(m); else if(h==="progress") progress(); else if(h==="journey") journey(); else if(h==="painlog") painlog(); else if(h==="exercises") exercises(); else if(h==="attendance") attendance(); else home();
  window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
